<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Painted Bobcat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2456b8;
    --navy: #1b2a4a;
    --gold: #f5b700;
    --cream: #fff6df;
    --ink: #1b2250;
    --page: #0e1330;
    color-scheme: dark;
  }
  @media (prefers-reduced-motion: reduce) {
    .star, .firefly, .spark, .glow { animation: none !important; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1d2660, var(--page) 70%);
    color: #fff;
    font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  #app {
    width: min(calc(100vw - 16px), calc((100vh - 150px) * 16 / 9));
    min-width: 300px;
    container-type: inline-size;
    display: flex; flex-direction: column; gap: 1cqw;
    padding: 8px 0;
  }
  #stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 1.4cqw; overflow: hidden;
    box-shadow: 0 1cqw 4cqw rgba(0,0,0,.5), 0 0 0 .35cqw var(--gold);
    background: #1b2250;
  }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; pointer-events: none; font-size: 2cqw; }

  /* caption */
  #caption {
    background: var(--cream); color: var(--ink);
    border-radius: 1.2cqw; border: .3cqw solid var(--gold);
    padding: .7cqw 1.4cqw; min-height: 6.4cqw;
    font-size: max(13px, 2.05cqw); line-height: 1.3;
    display: flex; align-items: center; gap: 1cqw;
    box-shadow: 0 .5cqw 1.5cqw rgba(0,0,0,.35);
  }
  #caption .who {
    flex: none; color: #fff; font-weight: 800; border-radius: 99px;
    padding: .1em .7em; font-size: .85em; white-space: nowrap;
  }
  #caption .txt { animation: capIn .35s ease-out; }
  @keyframes capIn { from { opacity: 0; transform: translateY(.4em); } }

  /* controls */
  #controls { display: flex; flex-wrap: wrap; gap: .6cqw; align-items: center; justify-content: center; }
  #controls button {
    font: inherit; font-weight: 700; font-size: max(12px, 1.5cqw);
    border: 0; border-radius: 99px; cursor: pointer;
    background: #2a3470; color: #fff; padding: .35em .9em;
  }
  #controls button:hover { background: #3a4690; }
  #controls button.on { background: var(--gold); color: var(--ink); }
  #chips { display: flex; flex-wrap: wrap; gap: .4cqw; justify-content: center; }
  #chips button { font-size: max(11px, 1.25cqw) !important; background: #222a5c !important; opacity: .8; }
  #chips button.active { background: var(--gold) !important; color: var(--ink) !important; opacity: 1; }

  /* start screen */
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5cqw; background: rgba(14,19,48,.72); backdrop-filter: blur(2px); text-align: center; z-index: 5;
  }
  #start .kicker { font-size: 2.2cqw; color: var(--gold); letter-spacing: .15em; text-transform: uppercase; font-weight: 700; }
  #start h1 { margin: 0; font-size: 7cqw; line-height: 1; text-shadow: 0 .4cqw 0 var(--blue), 0 .8cqw 2cqw rgba(0,0,0,.5); }
  #start button {
    font: inherit; font-size: 2.6cqw; font-weight: 800; color: var(--ink);
    background: var(--gold); border: 0; border-radius: 99px; padding: .5em 1.4em; cursor: pointer;
    box-shadow: 0 .5cqw 0 #b88600; animation: throb 1.6s infinite ease-in-out;
  }
  #start small { font-size: 1.5cqw; opacity: .8; }
  @keyframes throb { 50% { transform: scale(1.06); } }

  /* speech bubbles */
  .bubble {
    position: absolute; transform: translate(-50%, -100%);
    background: #fff; color: #222; border-radius: 1.4cqw; padding: .5cqw 1.1cqw;
    font-size: 1.8cqw; line-height: 1.25; max-width: 26cqw; width: max-content; text-align: center;
    box-shadow: 0 .4cqw 1cqw rgba(0,0,0,.3); border: .2cqw solid var(--ink);
    animation: pop .35s cubic-bezier(.2,1.6,.4,1);
  }
  .bubble::after {
    content: ""; position: absolute; left: var(--tail, 50%); bottom: -1.1cqw; transform: translateX(-50%);
    border: .6cqw solid transparent; border-top: .9cqw solid var(--ink);
  }
  .bubble.big { font-size: 2.6cqw; font-weight: 800; color: var(--blue); }
  @keyframes pop { from { transform: translate(-50%, -100%) scale(.2); opacity: 0; } }

  /* chapter card */
  .chapter {
    position: absolute; left: 50%; top: 6%; transform: translateX(-50%);
    text-align: center; animation: chapter 3.2s ease-in-out forwards;
  }
  .chapter .c1 { font-size: 1.7cqw; letter-spacing: .3em; text-transform: uppercase; color: #fff; opacity: .9; }
  .chapter .c2 {
    font-size: 6cqw; font-weight: 800; line-height: 1; color: var(--gold);
    text-shadow: 0 .35cqw 0 var(--blue), 0 0 2cqw rgba(0,0,0,.6);
  }
  @keyframes chapter {
    0% { opacity: 0; transform: translateX(-50%) scale(.6); }
    15%, 80% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(1.1); }
  }

  /* title card */
  .titlecard { position: absolute; left: 0; right: 0; top: 17%; text-align: center; animation: fadeIn 1.2s ease-out; transition: opacity .8s; }
  .titlecard.out { opacity: 0; }
  .titlecard .k { font-size: 2cqw; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .titlecard h1 { margin: .2em 0; font-size: 7.5cqw; line-height: 1; text-shadow: 0 .45cqw 0 var(--blue), 0 1cqw 3cqw rgba(0,0,0,.6); }
  .titlecard .t { font-size: 2.3cqw; }
  .titlecard b { color: var(--gold); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2cqw); } }

  /* three-things cards */
  .three { position: absolute; left: 0; right: 0; top: 7%; display: flex; justify-content: center; gap: 2cqw; }
  .three div {
    background: var(--cream); color: var(--ink); border: .3cqw solid var(--gold); border-radius: 1.5cqw;
    padding: .8cqw 1.6cqw; text-align: center; font-weight: 800; font-size: 2cqw; animation: popc .5s cubic-bezier(.2,1.6,.4,1);
  }
  .three span { display: block; font-size: 4cqw; line-height: 1.1; }
  @keyframes popc { from { transform: scale(.1) rotate(-20deg); opacity: 0; } }

  /* parchment panels */
  .panel {
    position: absolute; left: 57%; right: 2.5%; top: 4%; bottom: 5%;
    background: linear-gradient(#fff7e0, #f7e6b8); color: #3a2a12;
    border-radius: 1.5cqw; border: .35cqw solid #b07a2a;
    box-shadow: 0 1cqw 3cqw rgba(0,0,0,.45); padding: 1.2cqw 1.6cqw;
    animation: unroll .7s ease-out;
  }
  @keyframes unroll { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  .panel h2 { margin: 0 0 .5cqw; font-size: 2.8cqw; color: var(--blue); text-align: center; line-height: 1.1; }
  .ol {
    display: flex; gap: .8cqw; align-items: center; font-size: 2cqw; line-height: 1.2;
    padding: .45cqw .6cqw; border-radius: .8cqw; opacity: 0; transform: translateX(3cqw); transition: all .5s cubic-bezier(.2,1.4,.4,1);
  }
  .ol .e { font-size: 2.8cqw; flex: none; width: 3.6cqw; text-align: center; }
  .ol.show { opacity: 1; transform: none; }
  .ol.now { background: rgba(245,183,0,.35); }
  .lawgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8cqw; margin-top: 1cqw; }
  .lb {
    background: #fff; border: .25cqw solid var(--blue); border-radius: 1cqw; text-align: center;
    padding: .4cqw .2cqw; font-weight: 800; font-size: 1.65cqw; color: var(--blue);
    opacity: 0; transform: scale(.2) rotate(-15deg); transition: all .45s cubic-bezier(.2,1.6,.4,1);
  }
  .lb span { display: block; font-size: 3cqw; line-height: 1.15; }
  .lb.show { opacity: 1; transform: none; }
  .lb.gold { border-color: var(--gold); background: #fff4c4; }
  .lawgrid.dance .lb { animation: dance .5s ease-in-out infinite alternate; }
  .lawgrid.dance .lb:nth-child(2n) { animation-delay: -.25s; }
  @keyframes dance { from { transform: rotate(-6deg); } to { transform: rotate(6deg) translateY(-.4cqw); } }

  /* motto */
  .motto {
    position: absolute; left: 0; right: 0; top: 6%; text-align: center;
    font-size: 9cqw; font-weight: 800; line-height: 1; color: var(--gold);
    text-shadow: 0 .5cqw 0 var(--blue), 0 1cqw 0 var(--navy), 0 0 4cqw rgba(255,220,100,.6);
    animation: motto 1s cubic-bezier(.2,1.6,.4,1), wob 1.2s .9s ease-in-out infinite alternate;
  }
  @keyframes motto { from { transform: scale(0) rotate(-12deg); } }
  @keyframes wob { from { transform: rotate(-2deg); } to { transform: rotate(2deg) scale(1.04); } }
  .confetti { position: absolute; top: -3%; width: 1cqw; height: 1.6cqw; border-radius: .2cqw; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110cqh) rotate(var(--r)); } }
  #stage { container-type: size; }

  /* painted bobcat card */
  .marks {
    position: absolute; left: 70%; right: 3%; top: 8%;
    background: var(--cream); color: var(--ink); border-radius: 1.5cqw; border: .35cqw solid var(--gold);
    padding: 1cqw 1.2cqw; box-shadow: 0 1cqw 3cqw rgba(0,0,0,.45); animation: fadeIn .8s ease-out;
  }
  .marks h3 { margin: 0 0 .6cqw; font-size: 2.2cqw; text-align: center; color: var(--blue); line-height: 1.1; }
  .mk { display: flex; align-items: center; gap: .8cqw; padding: .5cqw .6cqw; border-radius: .8cqw; font-size: 1.6cqw; line-height: 1.15; opacity: .5; transition: all .4s; }
  .mk .dot { flex: none; width: 3cqw; height: 3cqw; border-radius: 50%; display: grid; place-items: center; font-size: 1.8cqw; }
  .mk b { display: block; font-size: 1.8cqw; }
  .mk.now { opacity: 1; background: rgba(245,183,0,.3); transform: scale(1.04); }
  .mk.done { opacity: 1; }
  .mk.done .dot { font-size: 0; }
  .mk.done .dot::after { content: "✓"; font-size: 1.8cqw; color: #1b2250; font-weight: 800; }

  /* finale */
  .finale { position: absolute; left: 0; right: 0; top: 24%; text-align: center; animation: fadeIn 1s ease-out; }
  .finale .fam { font-size: 4.6cqw; font-weight: 800; color: var(--gold); line-height: 1.05; text-shadow: 0 .4cqw 0 var(--blue), 0 0 2cqw rgba(0,0,0,.6); }
  .finale .welcome { font-size: 2.5cqw; font-weight: 700; text-shadow: 0 .2cqw .6cqw rgba(0,0,0,.8); }
  .replay {
    position: absolute; right: 2.5%; bottom: 4%; pointer-events: auto; font: inherit; font-weight: 800; font-size: 2cqw;
    background: var(--gold); color: var(--ink); border: 0; border-radius: 99px; padding: .4em 1.1em; cursor: pointer;
    box-shadow: 0 .4cqw 0 #b88600; animation: fadeIn 1s ease-out, throb 1.6s 1s infinite ease-in-out;
  }
  .url { position: absolute; left: 2.5%; bottom: 4%; font-size: 1.8cqw; font-weight: 700; color: #fff; text-shadow: 0 .2cqw .5cqw #000; }

  /* svg ambience */
  .star { animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .34s infinite alternate ease-in-out; }
  .flame.f2 { animation-duration: .27s; animation-delay: -.1s; }
  .flame.f3 { animation-duration: .21s; animation-delay: -.05s; }
  @keyframes flick { from { transform: scale(1, 1); } to { transform: scale(.92, 1.1); } }
  .glow { animation: glow 1.1s infinite alternate ease-in-out; }
  @keyframes glow { from { opacity: .5; } to { opacity: .85; } }
  .spark { animation: spark 2.4s infinite ease-out; }
  @keyframes spark { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx), -190px); opacity: 0; } }
  .firefly { animation: fly 7s infinite ease-in-out alternate; }
  @keyframes fly { 0% { transform: translate(0, 0); opacity: .15; } 50% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: .2; } }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .tail { transform-box: fill-box; transform-origin: 0% 50%; animation: wag .45s infinite alternate ease-in-out; }
  @keyframes wag { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }

  body.paused *, body.paused *::before, body.paused *::after { animation-play-state: paused !important; }

  #rotate { display: none; }
  @media (orientation: portrait) and (max-width: 600px) {
    #rotate { display: block; text-align: center; font-size: 13px; opacity: .75; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <svg id="scene" viewBox="0 0 1280 720" aria-label="Animated story of a Pack 149 Bobcat ceremony">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#141a45"/>
          <stop offset=".55" stop-color="#3b2f6e"/>
          <stop offset=".85" stop-color="#9a5a78"/>
          <stop offset="1" stop-color="#f0a064"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2f5d3a"/>
          <stop offset="1" stop-color="#1b3a24"/>
        </linearGradient>
        <radialGradient id="fireGlow">
          <stop offset="0" stop-color="#ffcf6a" stop-opacity=".9"/>
          <stop offset=".45" stop-color="#ff8a3a" stop-opacity=".35"/>
          <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="closeBg" cx=".42" cy=".55" r=".75">
          <stop offset="0" stop-color="#7a4a3a"/>
          <stop offset=".5" stop-color="#3b2750"/>
          <stop offset="1" stop-color="#141a45"/>
        </radialGradient>
      </defs>
      <g id="world">
        <g id="bg"></g>
        <g id="actors"></g>
        <g id="front"></g>
        <g id="close" style="display:none"></g>
        <g id="fx"></g>
      </g>
    </svg>
    <div id="overlay"></div>
    <div id="start">
      <div class="kicker">Cub Scout Pack 149 presents</div>
      <h1>The Painted Bobcat</h1>
      <button id="begin">▶ Begin the Ceremony</button>
      <small>Turn your sound up for music and narration 🎵 · Voices are AI-generated</small>
    </div>
  </div>
  <div id="caption"><span class="who" style="background:#6b4f9e">Pack 149</span><span class="txt">A story of Family, Fun &amp; Adventure.</span></div>
  <div id="controls">
    <button id="prev" title="Previous scene">⏮</button>
    <button id="play" title="Pause / play">⏸</button>
    <button id="next" title="Next scene">⏭</button>
    <div id="chips"></div>
    <button id="snd" class="on" title="Narration and sound effects">🔊 Voices</button>
    <button id="mus" class="on" title="Background music">🎵 Music</button>
  </div>
  <div id="rotate">Tip: turn your phone sideways for a bigger show!</div>
</div>

<script src="voices.js"></script>
<script>
/* =====================================================================
   THE PAINTED BOBCAT — a Pack 149 story
   Everything below is plain JavaScript + SVG. No libraries needed.
   Words spoken in the ceremony live in SCRIPT / OATH / LAW / MARKS —
   edit those to match your pack's own ceremony.
   ===================================================================== */

// ---------- Ceremony text (easy to edit) ----------
const OATH = [
  ['⭐', 'On my honor I will do my best'],
  ['🙏', 'to do my duty to God and my country'],
  ['📜', 'and to obey the Scout Law;'],
  ['🤝', 'to help other people at all times;'],
  ['💪', 'to keep myself physically strong,'],
  ['🧠', 'mentally awake,'],
  ['🧭', 'and morally straight.'],
];
const LAW = [
  ['🗝️', 'Trustworthy'], ['🐕', 'Loyal'], ['🤲', 'Helpful'], ['👋', 'Friendly'],
  ['🎩', 'Courteous'], ['💛', 'Kind'], ['👂', 'Obedient'], ['😄', 'Cheerful'],
  ['🐷', 'Thrifty'], ['🦁', 'Brave'], ['🧼', 'Clean'], ['🙏', 'Reverent'],
];
const MOTTO = 'Do Your Best!';
// The Painted Bobcat marks, in the order they are painted
// (from the Painted Bobcat Ceremony: blue, yellow, white, red, green).
const MARKS = [
  { key: 'paw', icon: '🐾', color: '#2a6fdb', title: 'Blue', sub: 'Paw print · forehead',
    lines: ['Blue is from the sky.',
            'The paw print of the Bobcat on your forehead is the spirit of the Bobcat. It reminds you to do your best on the Cub Scout trail.'] },
  { key: 'eyes', icon: '☀️', color: '#f4c400', title: 'Yellow', sub: 'Under the eyes',
    lines: ['Yellow is from the sun.',
            'The marks under your eyes help you see the light of the Cub Scout trail. They stand for the bright spirit of Cub Scouting.'] },
  { key: 'nose', icon: '🤍', color: '#e9eef5', title: 'White', sub: 'Nose',
    lines: ['White is for purity.',
            'The mark on your nose helps you know right from wrong as you go along the Cub Scout trail.'] },
  { key: 'chin', icon: '❤️', color: '#d8342c', title: 'Red', sub: 'Chin',
    lines: ['Red is for courage.',
            'The mark on your chin reminds you to always speak the truth.'] },
  { key: 'cheeks', icon: '🌲', color: '#2f9e44', title: 'Green', sub: 'Each cheek',
    lines: ['Green stands for the spirit of nature.',
            'The marks on each cheek guide you to live in harmony with the great outdoors.'] },
];
// What Akela says when the Scout paints a white stripe on each parent's nose.
const PARENT_WHITE = 'White is also for love and guidance. Your parents are always with you, in your heart and in your spirit, helping you reach all your Scout goals.';
const ALL_MARKS = MARKS.map(m => m.key);

// ---------- tiny helpers ----------
const NS = 'http://www.w3.org/2000/svg';
const $ = q => document.querySelector(q);
function S(tag, attrs = {}, kids = []) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  for (const c of [].concat(kids)) if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}
function H(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const W = 1280, HGT = 720;
const svg = $('#scene'), bg = $('#bg'), actorsL = $('#actors'), frontL = $('#front'),
      closeL = $('#close'), fxL = $('#fx'), overlay = $('#overlay');

// ---------- timeline engine (pause-aware, cancellable) ----------
const params = new URLSearchParams(location.search);
const SPEED = +params.get('speed') || 1;
let RUN = 0, paused = false, soundOn = true, current = 0;
const CANCEL = new Error('cancel');
window.addEventListener('unhandledrejection', e => { if (e.reason === CANCEL) e.preventDefault(); });
const ease = {
  lin: p => p,
  io: p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  out: p => 1 - Math.pow(1 - p, 3),
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
function tween(ms, fn, e = ease.io) {
  const id = RUN, dur = Math.max(1, ms / SPEED);
  return new Promise((res, rej) => {
    let t = 0, last = performance.now();
    const step = now => {
      if (id !== RUN) return rej(CANCEL);
      if (!paused) t += now - last;
      last = now;
      const p = Math.min(1, t / dur);
      fn(e(p), p);
      p >= 1 ? res() : requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
const wait = ms => tween(ms, () => {}, ease.lin);
const all = (...ps) => Promise.all(ps);

// ---------- sound: narration + little sound effects ----------
let AC = null, voice = null;
function pickVoice() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny|Natural/i.test(v.name))
       || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// Recorded voices: voices.js sets window.VOICES, mapping "Speaker|caption text" to an audio clip.
// Any line without a clip falls back to the browser's built-in voice.
let clip = null;
const clipFor = (name, text) => window.VOICES && window.VOICES[name + '|' + text];
function playClip(src) {
  return new Promise(res => {
    const a = new Audio(src);
    clip = a;
    a.playbackRate = Math.min(SPEED, 2);
    let done = false;
    a.finish = () => { if (!done) { done = true; music.duck(false); if (clip === a) clip = null; res(); } };
    a.onended = a.onerror = a.finish;
    music.duck(true);
    a.play().catch(a.finish);
  });
}
function stopClip() { if (clip) { clip.pause(); clip.finish(); } }
function speak(text, v = {}, name) {
  if (!soundOn) return Promise.resolve();
  const src = clipFor(name, text);
  if (src) return playClip(src);
  if (!window.speechSynthesis) return Promise.resolve();
  return new Promise(res => {
    const clean = text.replace(/\p{Extended_Pictographic}|️/gu, '').replace(/Akela/g, 'Ah-kay-la');
    const u = new SpeechSynthesisUtterance(clean);
    if (voice) u.voice = voice;
    u.pitch = v.pitch ?? 1; u.rate = (v.rate ?? 1) * Math.min(SPEED, 2);
    let done = false;
    const finish = () => { if (!done) { done = true; music.duck(false); res(); } };
    u.onend = u.onerror = finish;
    music.duck(true);
    speechSynthesis.speak(u);
    setTimeout(finish, (3000 + clean.length * 110) / SPEED); // safety net
  });
}
function tone(freq, dur = .15, type = 'sine', vol = .12, delay = 0, slide = 0) {
  if (!soundOn || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  pop: (p = 1) => tone(380 * p, .12, 'sine', .15, 0, 900 * p),
  chime: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .35, 'triangle', .09, i * .09)),
  sparkle: () => [1319, 1568, 2093].forEach((f, i) => tone(f, .2, 'sine', .05, i * .06)),
  boing: () => tone(180, .3, 'square', .05, 0, 520),
  rawr: () => { tone(220, .45, 'sawtooth', .07, 0, 110); tone(330, .4, 'square', .03, .02, 150); },
  swish: () => tone(900, .18, 'triangle', .04, 0, 1800),
  boom: () => { tone(90, .5, 'sine', .15, 0, 40); tone(1400, .25, 'triangle', .03, .05, 600); },
};

// ---------- background music: an original campfire tune, made live with Web Audio ----------
// Moods: 'calm' (ukulele-style strum + whistled melody), 'soft' (gentle pad under the
// Oath, Law and face paint), 'party' (adds a little drum beat).
const music = (() => {
  let on = true, out = null, timer = null, step = 0, next = 0, mood = 'calm', ducks = 0, noiseBuf = null;
  const E = 60 / 104 / 2; // one eighth note at 104 bpm
  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62],
                  [60, 64, 67], [53, 57, 60], [55, 59, 62], [60, 64, 67]]; // C Am F G | C F G C
  const _ = 0, MELODY = [
    67, _, 64, 67, 72, _, 67, _,   69, _, 67, 64, 60, _, _, _,
    65, _, 69, 72, 74, 72, 69, _,  67, _, _, 71, 74, _, 71, _,
    72, _, 67, 64, 67, _, 72, _,   69, _, 72, 69, 65, _, 69, _,
    67, 71, 74, 71, 67, _, 62, _,  60, _, 64, _, 60, _, _, _];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol, attack = .005) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(out); o.start(t); o.stop(t + dur + .05);
  }
  function shaker(t, vol) {
    if (!noiseBuf) {
      noiseBuf = AC.createBuffer(1, AC.sampleRate * .1, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = AC.createBufferSource(), hp = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = 6000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .06);
    src.connect(hp).connect(g).connect(out); src.start(t); src.stop(t + .08);
  }
  function kick(t) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + .14);
    g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.0001, t + .2);
    o.connect(g).connect(out); o.start(t); o.stop(t + .22);
  }
  function play(i, t) {
    const bar = Math.floor(i / 8) % 8, s = i % 8, ch = CHORDS[bar];
    if (s === 0 || s === 4) note(ch[0] - 24, t, E * 3.6, 'triangle', .22);            // bass
    if (mood === 'soft') {
      if (s === 0) ch.forEach(m => note(m, t, E * 8.5, 'sine', .04, .5));            // warm pad
      if (s % 2 === 0) note(ch[(s / 2) % 3] + 12, t, E * 3, 'sine', .03);           // music-box twinkle
      return;
    }
    note(ch[[0, 1, 2, 1, 0, 1, 2, 1][s]], t, E * 1.7, 'triangle', .055);             // ukulele-ish strum
    const m = MELODY[bar * 8 + s];
    if (m) note(m + 12, t, E * 1.9, 'sine', .06, .02);                                // whistled melody
    if (mood === 'party') { if (s % 4 === 0) kick(t); if (s % 2 === 1) shaker(t, .06); }
    else if (s % 2 === 1) shaker(t, .018);
  }
  function tick() { while (next < AC.currentTime + .15) { play(step++, next); next += E; } }
  const level = () => (ducks > 0 ? .2 : .45);
  return {
    start() {
      if (!AC || !on || timer) return;
      if (!out) { out = AC.createGain(); out.gain.value = level(); out.connect(AC.destination); }
      next = AC.currentTime + .1; timer = setInterval(tick, 30);
    },
    stop() { clearInterval(timer); timer = null; },
    setMood(m) { mood = m || 'calm'; },
    duck(d) {
      ducks = Math.max(0, ducks + (d ? 1 : -1));
      if (out) out.gain.setTargetAtTime(level(), AC.currentTime, .15);
    },
    toggle(v) { on = v; v ? this.start() : this.stop(); },
  };
})();

// ---------- caption + bubbles ----------
function setCaption(name, text, color) {
  $('#caption').innerHTML = `<span class="who" style="background:${color}">${name}</span><span class="txt"></span>`;
  $('#caption .txt').textContent = text;
}
function showBubble(x, y, text, big) {
  const b = H('div', 'bubble' + (big ? ' big' : ''));
  b.textContent = text;
  const cx = Math.max(150, Math.min(W - 150, x));
  b.style.left = (cx / W * 100) + '%';
  b.style.top = (Math.max(90, y) / HGT * 100) + '%';
  b.style.setProperty('--tail', `calc(50% + ${((x - cx) / W * 100).toFixed(2)}cqw)`);
  overlay.appendChild(b);
  return b;
}
const NARRATOR = { name: 'Narrator', color: '#6b4f9e', voice: { pitch: 1, rate: .95 } };
function say(who, text, { bubble = true, min = 0, big = false } = {}) {
  who = who || NARRATOR;
  setCaption(who.name, text, who.color);
  const b = (bubble && who.top) ? showBubble(who.x, who.top() - 14, text, big) : null;
  if (params.has('collect')) (window.__lines ||= {})[who.name + '|' + text] = [who.name, text];
  const words = text.split(/\s+/).length;
  const recorded = soundOn && clipFor(who.name, text);
  return all(wait(recorded ? Math.max(min, 400) : Math.max(min, 1300 + words * 310)), speak(text, who.voice, who.name))
    .then(() => recorded && wait(300))
    .then(() => { b && b.remove(); });
}
const narrate = (text, o) => say(null, text, o);
function chapter(kicker, title) {
  const c = H('div', 'chapter', `<div class="c1">${kicker}</div><div class="c2">${title}</div>`);
  c.addEventListener('animationend', () => c.remove());
  overlay.appendChild(c);
}

class Actor {
  constructor(g, o) { Object.assign(this, { x: -600, y: GROUND, s: 1, bob: 0, rot: 0, cy: -150, arms: {} }, o); this.g = g; this.place(); }
  place() { this.g.setAttribute('transform', `translate(${this.x.toFixed(1)},${(this.y + this.bob).toFixed(1)}) scale(${this.s}) rotate(${this.rot} 0 ${this.cy})`); }
  at(x, y = this.y) { this.x = x; this.y = y; this.place(); return this; }
  top() { return this.y + this.headTop * this.s; }
  walk(x, ms = 2600) {
    const x0 = this.x;
    return tween(ms, (p, raw) => { this.x = x0 + (x - x0) * p; this.bob = -Math.abs(Math.sin(raw * ms / 150)) * 9; this.place(); }, ease.io)
      .then(() => { this.bob = 0; this.place(); });
  }
  jump(h = 50, ms = 420) { return tween(ms, (p, raw) => { this.bob = -Math.sin(Math.PI * raw) * h; this.place(); }, ease.lin); }
  async hop(n = 2, h = 45) { for (let i = 0; i < n; i++) await this.jump(h); }
  spin(ms = 800) { return tween(ms, p => { this.rot = 360 * p; this.place(); }).then(() => { this.rot = 0; this.place(); }); }
  setArm(k, a) { const A = this.arms[k]; if (!A) return; A.a = a; A.el.setAttribute('transform', `rotate(${a} ${A.px} ${A.py})`); }
  arm(k, a, ms = 600) { const A = this.arms[k]; if (!A) return Promise.resolve(); const a0 = A.a; return tween(ms, p => this.setArm(k, a0 + (a - a0) * p)); }
  wave(ms = 1600) {
    const A = this.arms.R, a0 = A.a, base = -150;
    return tween(ms, (p, raw) => {
      let a;
      if (raw < .18) a = a0 + (base - a0) * (raw / .18);
      else if (raw > .82) a = base + (a0 - base) * ((raw - .82) / .18);
      else a = base + Math.sin((raw - .18) * ms / 85) * 18;
      this.setArm('R', a);
    }, ease.lin);
  }
  sign(on) {
    if (this.fingers) this.fingers.style.display = on ? '' : 'none';
    return this.arm('L', on ? 168 : this.restL, 650);
  }
  mood(m) { this.head && this.head.mood(m); }
}

function signFingers(cx, cy, w, h, skin) {
  return S('g', { style: 'display:none' }, [-1, 1].map(sd => S('rect', {
    x: cx - w / 2 + sd * w * .55, y: cy, width: w, height: h, rx: w / 2, fill: skin,
    transform: `rotate(${-sd * 12} ${cx} ${cy})` })));
}
function limb(x, y, w, h, fill, hand, skin, extra) {
  const g = S('g');
  g.append(S('rect', { x, y, width: w, height: h, rx: w / 2, fill }));
  if (extra) g.append(extra);
  g.append(S('circle', { cx: hand[0], cy: hand[1], r: hand[2], fill: skin }));
  return g;
}

function makeBrush(scale = 1) {
  const bristle = S('path', { d: 'M0,0 C-8,-8 -8,-20 -7,-28 L7,-28 C8,-20 8,-8 0,0Z', fill: '#2a6fdb' });
  const inner = S('g', { transform: `scale(${scale}) rotate(35)` }, [
    S('path', { d: 'M-5,-40 L-4,-116 Q0,-122 4,-116 L5,-40Z', fill: '#d9534f' }),
    S('rect', { x: -8, y: -42, width: 16, height: 15, rx: 2, fill: '#c9ccd3' }), bristle]);
  const g = S('g', {}, inner);
  fxL.append(g);
  const b = { g, x: 1400, y: 200,
    set(x, y) { b.x = x; b.y = y; g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`); },
    tip(c) { bristle.setAttribute('fill', c); },
    fly(x, y, ms = 500) { const x0 = b.x, y0 = b.y; return tween(ms, p => b.set(x0 + (x - x0) * p, y0 + (y - y0) * p - Math.sin(Math.PI * p) * 40)); } };
  b.set(1400, 200);
  return b;
}
function toWorld(el, x, y) {
  const m = svg.getScreenCTM().inverse().multiply(el.getScreenCTM());
  return new DOMPoint(x, y).matrixTransform(m);
}
async function paintMark(head, key, brush, ms = 700) {
  brush.tip(PAINT[key].color);
  for (const el of head.paint[key]) {
    const L = el.getTotalLength(), p0 = el.getPointAtLength(0), w0 = toWorld(el, p0.x, p0.y);
    await brush.fly(w0.x, w0.y, 320);
    el.setAttribute('opacity', 1);
    sfx.swish();
    await tween(ms, p => {
      el.style.strokeDashoffset = 1 - p;
      const pt = el.getPointAtLength(p * L), w = toWorld(el, pt.x, pt.y);
      brush.set(w.x, w.y);
    }, ease.io);
    if (el.dataset.fill) el.setAttribute('fill', el.dataset.fill);
  }
}
function burst(x, y, colors = ['#f5b700', '#2a6fdb', '#fff'], n = 18, dist = 90, size = 5) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, c = colors[i % colors.length];
    const d = S('circle', { r: size, fill: c });
    fxL.append(d);
    tween(900, (p, raw) => {
      d.setAttribute('cx', x + Math.cos(a) * dist * p);
      d.setAttribute('cy', y + Math.sin(a) * dist * p + raw * raw * 30);
      d.setAttribute('opacity', 1 - raw);
    }, ease.out).then(() => d.remove(), () => {});
  }
}
function sparkleAt(x, y) {
  for (let i = 0; i < 7; i++) {
    const st = S('path', { d: starPath(0, 0, 9, 3.5), fill: i % 2 ? '#fff6a8' : '#f5b700' });
    fxL.append(st);
    const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 50;
    tween(800, (p, raw) => st.setAttribute('transform', `translate(${x + Math.cos(a) * r * p},${y + Math.sin(a) * r * p}) scale(${1 - raw * .8}) rotate(${raw * 180})`), ease.out)
      .then(() => st.remove(), () => {});
  }
}
function confetti(n = 70) {
  const cols = ['#f5b700', '#2456b8', '#fff', '#ff7a9a', '#5fd38a'];
  for (let i = 0; i < n; i++) {
    const c = H('div', 'confetti');
    c.style.left = (Math.random() * 100) + '%';
    c.style.background = cols[i % cols.length];
    c.style.setProperty('--dx', ((Math.random() - .5) * 20).toFixed(1) + 'cqw');
    c.style.setProperty('--r', (Math.random() * 900 - 450).toFixed(0) + 'deg');
    c.style.animationDuration = (2.2 + Math.random() * 2) / SPEED + 's';
    c.style.animationDelay = (Math.random() * .8) + 's';
    c.addEventListener('animationend', () => c.remove());
    overlay.appendChild(c);
  }
}

const POS = { dad: 230, mom: 385, max: 545, akela: 1100, cat: 880 };
function stand(c, pos = POS) { for (const k in pos) c[k].at(pos[k]); }

async function sceneBobcat() {
  const c = makeCast(); stand(c); c.cat.at(BUSH_X, GROUND + 140);

const OATH_POS = { dad: 110, mom: 255, max: 405, akela: 570, cat: 690 };
async function sceneOath() {
  const c = makeCast(); stand(c, OATH_POS);
  await say(c.akela, 'Max, please give the Cub Scout sign and say the Scout Oath.');
  await all(c.max.sign(true), c.mom.sign(true), c.dad.sign(true), c.akela.sign(true));
  const panel = H('div', 'panel', '<h2>The Scout Oath</h2>');
  OATH.forEach(([e, t]) => panel.append(H('div', 'ol', `<span class="e">${e}</span><span>${t}</span>`)));
  overlay.append(panel);
  await wait(700);
  const lines = panel.querySelectorAll('.ol');
  for (let i = 0; i < OATH.length; i++) {
    lines.forEach(l => l.classList.remove('now'));
    lines[i].classList.add('show', 'now');
    sfx.pop(1 + i * .08);

  sfx.chime();
  await all(c.cat.spin(), c.cat.jump(60, 800), say(c.akela, 'Perfect! You said that with your whole heart.'));

  grid.classList.add('dance');
  c.max.mood('joy'); sfx.chime();
  await all(c.mom.jump(30), say(c.mom, 'Wow! Twelve out of twelve!'));
  await all(c.dad.jump(30), say(c.dad, 'That’s our Cub Scout!'));
}

async function sceneMotto() {
  chapter('Chapter Two', 'Fun');
  const c = makeCast(); stand(c);
  await wait(1800);
  await say(c.akela, 'And last but not least... what is our motto?');
  c.max.mood('joy');
  const m = H('div', 'motto', MOTTO.toUpperCase());
  overlay.append(m);
  confetti(); sfx.chime(); sfx.boing();
  burst(300, 250); burst(980, 230, ['#2a6fdb', '#fff']);
  await all(c.max.jump(80, 600), c.mom.jump(40, 600), c.dad.jump(40, 600), c.cat.spin(900),
            say(c.max, MOTTO.toUpperCase(), { big: true, min: 2200 }));
  c.dad.mood('joy'); c.mom.mood('joy');
  await all(c.max.hop(2), c.cat.hop(3, 30),
            narrate('Do Your Best! Three little words that turn every day, even the tricky ones, into a chance to grow.'));
}

async function scenePaint() {
  chapter('Chapter Three', 'Adventure');
  // Akela calls Max and family forward
  const c = makeCast(); stand(c, FP_POS);
  await wait(1500);
  await say(c.akela, 'Tonight, one of our Scouts has worked very hard. Will Max and his parents please come forward to take on the colors and spirit of Cub Scouting?');
  c.max.mood('joy');
  await all(c.max.hop(2), c.mom.jump(25), c.dad.jump(25), wait(600));
  resetStage();
  // close-up of Max
  closeL.style.display = '';
  closeL.append(S('rect', { width: W, height: HGT, fill: 'url(#closeBg)' }));
  const r = rng(7);
  for (let i = 0; i < 30; i++) {
    const st = S('circle', { cx: r() * W, cy: r() * HGT, r: 1 + r() * 2, fill: '#fff', class: 'star' });
    st.style.animationDelay = (-r() * 3).toFixed(2) + 's';
    closeL.append(st);
  }
  closeL.append(S('circle', { cx: 540, cy: 760, r: 330, fill: 'url(#fireGlow)', class: 'glow' }));
  closeL.append(S('path', { d: 'M230,720 Q250,600 430,575 L650,575 Q830,600 850,720Z', fill: '#1f2d5c' }),
                S('rect', { x: 505, y: 520, width: 70, height: 70, fill: '#f6c9a0' }),
                S('g', { transform: 'translate(540,1072)' }, neckerchief(2.9)));
  const head = makeHead({ skin: '#f6c9a0', hair: '#2e2019', hairTop: MAX_HAIR });
  closeL.append(S('g', { transform: 'translate(540,350) scale(3.2)' }, head.g));
  const card = H('div', 'marks', '<h3>The Painted Bobcat</h3>');
  MARKS.forEach(mk => card.append(H('div', 'mk', `<span class="dot" style="background:${mk.color}">${mk.icon}</span><span><b>${mk.title}</b>${mk.sub}</span>`)));
  overlay.append(card);
  const items = card.querySelectorAll('.mk');
  const akela = { name: 'Akela', color: '#8a6a2e', voice: { pitch: .9, rate: .94 } };
  const max = { name: 'Max', color: '#2456b8', voice: { pitch: 1.55, rate: 1.08 } };
  await narrate('As Akela says each color, Mom and Dad take turns with the brush.', { min: 1800 });
  const brush = makeBrush(2.3);
  for (let i = 0; i < MARKS.length; i++) {
    const mk = MARKS[i];
    items.forEach(it => it.classList.remove('now'));
    items[i].classList.add('now');
    head.mood(i % 2 ? 'joy' : undefined);
    await all(paintMark(head, mk.key, brush, 700), say(akela, mk.lines[0], { bubble: false, min: 1500 }));
    for (const line of mk.lines.slice(1)) await say(akela, line, { bubble: false });
    items[i].classList.remove('now'); items[i].classList.add('done');
    sfx.sparkle(); sparkleAt(540, 350);
  }
  await brush.fly(1400, 150, 600);
  head.mood('joy'); sfx.rawr();
  burst(540, 300, ['#2a6fdb', '#f4c400', '#fff', '#d8342c', '#2f9e44'], 25, 260, 7);
  await say(max, 'RAWR!', { bubble: false, min: 1400 });
  await say(max, 'I’m a real Bobcat!', { bubble: false });
}

const FP_POS = { dad: 300, mom: 455, max: 615, akela: 1100, cat: 880 };
async function sceneFamilyPaint() {
  const c = makeCast(); stand(c, FP_POS);
  c.max.head.painted(ALL_MARKS);
  c.max.mood('joy');
  await say(c.akela, 'Mom and Dad, please hand the brush to Max. It’s your turn now!');
  c.max.mood();
  c.mom.mood('wow'); c.dad.mood('wow');
  await say(c.mom, 'Us too?!');
  c.mom.mood(); c.dad.mood('joy');
  await say(c.dad, 'Make it extra fierce!');
  c.dad.mood();
  const brush = makeBrush(1);
  brush.tip('#ffffff');
  brush.set(c.max.x + 55, c.max.y - 95);
  await c.max.arm('R', -140, 500);
  await narrate('Max dips the brush in white paint and gives each parent a stripe down the nose.', { min: 1500 });
  c.mom.mood('joy');
  await all(paintMark(c.mom.head, 'nose', brush, 600), wait(900));
  sparkleAt(c.mom.x, c.mom.top() + 90); sfx.sparkle();
  await say(c.mom, 'Hee hee! That tickles!');
  c.dad.mood('joy');
  await all(paintMark(c.dad.head, 'nose', brush, 600), wait(900));
  sparkleAt(c.dad.x, c.dad.top() + 90); sfx.sparkle();
  await brush.fly(c.max.x + 55, c.max.y - 250, 400);
  brush.g.remove();
  await c.max.arm('R', -8, 400);
  await say(c.akela, PARENT_WHITE);
  c.dad.mood();
  await say(c.dad, 'How do I look? Fierce?');
  c.max.mood('joy'); sfx.rawr();
  await all(c.max.hop(2), say(c.max, 'You look AWESOME!'));
  await say(c.akela, 'Congratulations, Max. You are officially a Bobcat of Pack 149!');
  c.max.badge.style.display = '';
  sfx.chime(); sparkleAt(c.max.x - 25, c.max.y - 98);
  await all(c.max.jump(60, 520), c.mom.hop(1, 30), c.dad.hop(1, 30), wait(900));
}

const FIN_POS = { dad: 300, max: 455, mom: 610, akela: 1100, cat: 880 };
async function sceneFinale() {
  const c = makeCast(); stand(c, FIN_POS);
  c.max.head.painted(ALL_MARKS);
  for (const k of ['max', 'mom', 'dad']) c[k].mood('joy');
  c.mom.head.painted(['nose']); c.dad.head.painted(['nose']);
  c.max.badge.style.display = '';
  c.mom.setArm('L', 40); c.dad.setArm('R', -40);
  const fin = H('div', 'finale', `<div class="fam">Family · Fun · Adventure</div><div class="welcome">Welcome to Pack 149, Bobcat Max!</div>`);
  overlay.append(fin);
  confetti(90); sfx.chime();
  burst(250, 200); burst(1050, 180, ['#2a6fdb', '#fff']);
  await narrate('Every new Scout’s first milestone. A proud moment for Scouts and families alike. And for Max and his family, a brand-new adventure has begun!');
  const b = [c.dad, c.max, c.mom, c.cat].map(a => showBubble(a.x, a.top() - 14, 'RAWR!', true));
  sfx.rawr(); sfx.boom();
  await all(c.max.jump(70, 550), c.mom.jump(45, 550), c.dad.jump(45, 550), c.cat.spin(700), c.akela.wave(1800),
            say(null, 'RAWR! Welcome to Pack 149!', { min: 2000 }));
  b.forEach(x => x.remove());
  const rb = H('button', 'replay', '↻ Watch again');
  rb.onclick = () => start(0);
  overlay.append(rb, H('div', 'url', 'bsapack149.org'));
  setCaption('Pack 149', 'The End. Family, Fun and Adventure start here!', '#6b4f9e');
  for (let i = 0; i < 40; i++) {
    const x = 120 + Math.random() * 1040, y = 190 + Math.random() * 140;
    burst(x, y, i % 2 ? ['#f5b700', '#fff'] : ['#2a6fdb', '#ff7a9a', '#fff'], 20, 70 + Math.random() * 50, 4);
    sfx.boom();
    if (i % 4 === 0) c[['max', 'mom', 'dad', 'cat'][i / 4 % 4]].jump(35);
    await wait(1100);
  }
}

const SCENES = [
  { name: 'Welcome', mood: 'calm', run: sceneWelcome },
  { name: 'Family', mood: 'calm', run: sceneFamily },
  { name: 'Bobcat', mood: 'calm', run: sceneBobcat },
  { name: 'Oath', mood: 'soft', run: sceneOath },
  { name: 'Law', mood: 'soft', run: sceneLaw },
  { name: 'Motto', mood: 'party', run: sceneMotto },
  { name: 'Face Paint', mood: 'soft', run: scenePaint },
  { name: 'Parents', mood: 'calm', run: sceneFamilyPaint },
  { name: 'Finale', mood: 'party', run: sceneFinale },
];

// ---------- player ----------
function resetStage() {
  actorsL.innerHTML = ''; fxL.innerHTML = ''; overlay.innerHTML = '';
  closeL.style.display = 'none'; closeL.innerHTML = '';
  setBush(0);
}
function updateNav() {
  document.querySelectorAll('#chips button').forEach((b, i) => b.classList.toggle('active', i === current));
  $('#play').textContent = paused ? '▶' : '⏸';
}
async function start(i) {
  const id = ++RUN;
  if (window.speechSynthesis) speechSynthesis.cancel();
  stopClip();
  setPaused(false);
  for (let k = Math.max(0, i); k < SCENES.length; k++) {
    if (id !== RUN) return;
    current = k; updateNav(); resetStage(); music.setMood(SCENES[k].mood);
    try { await SCENES[k].run(); await wait(600); }
    catch (e) { if (e === CANCEL) return; console.error(e); }
  }
}
function setPaused(p) {
  paused = p;
  document.body.classList.toggle('paused', p);
  if (window.speechSynthesis) p ? speechSynthesis.pause() : speechSynthesis.resume();
  if (clip) p ? clip.pause() : clip.play().catch(() => {});
  if (AC) p ? AC.suspend() : AC.resume();
  updateNav();
}
SCENES.forEach((s, i) => {
  const b = H('button', '', s.name);
  b.onclick = () => { hideStart(); start(i); };
  $('#chips').append(b);
});
function hideStart() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  music.start();
  $('#start').style.display = 'none';
}
$('#begin').onclick = () => { hideStart(); start(0); };
$('#prev').onclick = () => { hideStart(); start(current - 1); };
$('#next').onclick = () => { hideStart(); start(Math.min(SCENES.length - 1, current + 1)); };
$('#play').onclick = () => { if ($('#start').style.display !== 'none') { hideStart(); start(0); } else setPaused(!paused); };
$('#snd').onclick = () => {
  soundOn = !soundOn;
  $('#snd').classList.toggle('on', soundOn);
  $('#snd').textContent = soundOn ? '🔊 Voices' : '🔇 Voices';
  if (!soundOn) { if (window.speechSynthesis) speechSynthesis.cancel(); stopClip(); }
};
$('#mus').onclick = () => {
  const v = !$('#mus').classList.contains('on');
  $('#mus').classList.toggle('on', v);
  $('#mus').textContent = v ? '🎵 Music' : '🔇 Music';
  music.toggle(v);
};
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.code === 'ArrowRight') $('#next').click();
  if (e.code === 'ArrowLeft') $('#prev').click();
});

buildBackground();
// idle preview behind the start screen
(() => { const c = makeCast(); stand(c); c.max.mood('joy'); })();
updateNav();
if (params.has('scene')) { hideStart(); start(+params.get('scene')); }
</script>

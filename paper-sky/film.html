<script>
'use strict';
// Engine/craft snapshot generated by tools/new-riso.mjs. Edit this HTML for this work.
// Donors: prints/workings (baked print), studies/index (live tone/motion), tools/lib/visual-kit.
// Re-run the generator only to create a NEW file. This source owns all subsequent art edits.
const CSS=720, W=1080, OUT=1080, K=1, PITCH=4.6, DUR=72;
const PAPER = '#F2EDE3';
const INK = {
  blue:   '#0078BF',
  pink:   '#FF48B0',
  yellow: '#FFE800',
  green:  '#00A95C',
  orange: '#FF6C2F',
  violet: '#765BA7',
  indigo: '#2E3192',
};

/* Screen angles as rational tangents (b/a). A rotated dot grid only repeats
   seamlessly on a rational tangent, so these are the real angles rather than
   the nominal 15/45/75 — any other value leaves a visible seam where the
   pattern tile wraps. */
const SCREEN = {
  blue:   { a: 4, b: 1 },   // 14.0°
  pink:   { a: 1, b: 4 },   // 76.0°
  yellow: { a: 1, b: 0 },   //  0.0°
  green:  { a: 1, b: 1 },   // 45.0°
  orange: { a: 2, b: 1 },   // 26.6°
  violet: { a: 1, b: 2 },   // 63.4°
  indigo: { a: 1, b: 1 },   // 45.0°
};

/* Registration: each plate misses by a fixed amount, in device px. */
const REG = {
  blue:   [ 1.5, -1.0], pink:   [-2.5,  2.0], yellow: [ 2.0,  1.5],
  green:  [-1.5, -1.5], orange: [ 1.0,  2.0], violet: [-2.0, -1.0],
  indigo: [ 0.0,  0.0],
};

const CX = W / 2, CY = W / 2;

/* ── deterministic randomness ─────────────────────────────────────────────── */

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const rngFor = (key) => mulberry32(hash(key));

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, u) => a + (b - a) * u;

function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ── halftone screens ─────────────────────────────────────────────────────────
   For screen angle tanθ = b/a the dot lattice is generated by the orthogonal
   vectors P/√(a²+b²)·(a,b) and P/√(a²+b²)·(−b,a). That lattice contains
   (P√(a²+b²), 0), so a square tile of side S = P√(a²+b²) repeats seamlessly and
   holds exactly a²+b² dots.

   Screens are anchored to canvas space, never to the object being drawn. A
   screen that rides along with its subject makes the texture crawl, which is
   the single most recognisable way this look goes wrong.                     */

const screens = {};

function buildScreen(name) {
  const { a, b } = SCREEN[name];
  const n = a * a + b * b;
  const S = Math.max(2, Math.round(PITCH * Math.sqrt(n)));
  const P = S / Math.sqrt(n);              // effective pitch after rounding
  const u = P / Math.sqrt(n);
  const v1 = [u * a, u * b], v2 = [-u * b, u * a];

  // Lattice points reduced into the tile, plus wrapped neighbours so dots that
  // straddle an edge are drawn on both sides.
  const pts = [];
  for (let m = -n; m <= n; m++) {
    for (let k = -n; k <= n; k++) {
      const x = m * v1[0] + k * v2[0], y = m * v1[1] + k * v2[1];
      const wx = ((x % S) + S) % S, wy = ((y % S) + S) % S;
      if (!pts.some(p => Math.abs(p[0] - wx) < 0.01 && Math.abs(p[1] - wy) < 0.01)) pts.push([wx, wy]);
    }
  }
  const wrapped = [];
  for (const [x, y] of pts) for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) wrapped.push([x + dx, y + dy]);

  // Threshold tile: a pixel takes ink when coverage exceeds π·d²/P², which is
  // the coverage at which a dot of radius d would reach that pixel.
  const th = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let d2 = Infinity;
      for (const [px, py] of wrapped) {
        const dx = x + 0.5 - px, dy = y + 0.5 - py, q = dx * dx + dy * dy;
        if (q < d2) d2 = q;
      }
      th[y * S + x] = clamp(Math.PI * d2 / (P * P), 0, 1);
    }
  }
  return { S, P, pts, wrapped, th, patterns: new Map() };
}

function screenOf(name) {
  return screens[name] || (screens[name] = buildScreen(name));
}

/** Screen a greyscale coverage canvas into hard dots. Bake-time only. */
function screenCoverage(covCanvas, name) {
  const sc = screenOf(name);
  const w = covCanvas.width, h = covCanvas.height;
  const src = covCanvas.getContext('2d').getImageData(0, 0, w, h);
  const s = src.data;
  for (let y = 0; y < h; y++) {
    const row = (y % sc.S) * sc.S;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const cover = s[i + 3] / 255;
      s[i + 3] = cover > sc.th[row + (x % sc.S)] ? 255 : 0;
    }
  }
  const out = cv(w, h);
  out.getContext('2d').putImageData(src, 0, 0);
  return out;
}

/* ── paper ────────────────────────────────────────────────────────────────────
   Cloudy mottling rather than fine grain: the reference shows blotches a few
   hundred px across at low contrast. Baked once, never recomputed, because any
   per-frame regeneration flickers.                                           */

let paper = null;

function bakePaper() {
  const c = cv(OUT, OUT), x = c.getContext('2d', { willReadFrequently: true });   // CPU-backed: survives GPU context loss
  x.setTransform(K, 0, 0, K, 0, 0);
  x.fillStyle = PAPER; x.fillRect(0, 0, W, W);

  const r = rngFor('paper');

  // Mottling is a warm wash with noisy alpha, not a neutral multiply: greyscale
  // noise multiplied over cream desaturates it and reads as smoke rather than
  // paper. Keep it subtle at full size and only obvious when zoomed.
  for (const [res, maxA] of [[30, 0.10], [72, 0.075], [165, 0.05]]) {
    const n = cv(res, res), nx = n.getContext('2d');
    const img = nx.createImageData(res, res);
    for (let i = 0; i < res * res; i++) {
      img.data[i * 4] = 0xB4; img.data[i * 4 + 1] = 0xA6; img.data[i * 4 + 2] = 0x8C;
      img.data[i * 4 + 3] = Math.pow(r(), 1.8) * 255 * maxA;
    }
    nx.putImageData(img, 0, 0);
    x.save();
    x.imageSmoothingEnabled = true;
    x.imageSmoothingQuality = 'high';
    x.drawImage(n, 0, 0, W, W);
    x.restore();
  }

  x.save();                                  // fibres
  x.strokeStyle = '#8a7f6a';
  for (let i = 0; i < 420; i++) {
    const px = r() * W, py = r() * W, len = 5 + r() * 22, ang = r() * Math.PI;
    x.globalAlpha = 0.008 + r() * 0.016;
    x.lineWidth = 0.5 + r() * 0.7;
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 5,
                       py + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 5,
                       px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.restore();

  x.save();                                  // flecks
  for (let i = 0; i < 2200; i++) {
    x.globalAlpha = 0.012 + r() * 0.03;
    x.fillStyle = r() < 0.55 ? '#7d7362' : '#ffffff';
    x.beginPath();
    x.arc(r() * W, r() * W, 0.4 + r() * 1.0, 0, Math.PI * 2);
    x.fill();
  }
  x.restore();
  return c;
}

/* ── scene drawing helpers ────────────────────────────────────────────────────
   Scenes draw coverage in 1080-space and alpha is tone, so 0.4 means a 40%
   dot screen. Shape helpers carry hand wobble; nothing here is a true circle
   or a straight line.                                                        */

function makeWob(rng, harmonics = 3) {
  const h = [];
  for (let i = 0; i < harmonics; i++) h.push([2 + i, rng() * 2 - 1, rng() * Math.PI * 2]);
  return (th) => h.reduce((s, [k, a, p]) => s + a * Math.sin(k * th + p), 0) / harmonics;
}

const tone = (g, a) => { g.globalAlpha = clamp(a, 0, 1); };


/* ── scene registry ───────────────────────────────────────────────────────── */

const SCENES = {};
const scene = (id, def) => { SCENES[id] = Object.assign({ id, live: null }, def); };

const baked = new Map();

/**
 * Bake a scene to one opaque bitmap: every plate screened, tinted, offset and
 * multiplied onto white, ready to multiply over paper.
 *
 * Baked at its display size, never scaled afterwards. Resampling a halftoned
 * bitmap beats the dot grid against the pixel grid and moirés; real print
 * screens at final size too.
 */
function bakeScene(id, size) {
  const key = id + '@' + size;
  if (baked.has(key)) return baked.get(key);
  const sc = SCENES[id];
  const k = size / W;
  const out = cv(size, size), o = out.getContext('2d');
  o.fillStyle = '#fff';
  o.fillRect(0, 0, size, size);

  const cover = cv(size, size), g = cover.getContext('2d');
  for (const ink of sc.inks) {
    const plate = ink;
    g.setTransform(k, 0, 0, k, 0, 0);
    g.clearRect(0, 0, W, W);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = g.strokeStyle = '#000';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.save();
    sc.plates(g, ink, rngFor(id + ':' + ink), rngFor(id + ':shape'));
    g.restore();
    starve(g, rngFor(id + ':' + ink + ':void'));

    const dots = screenCoverage(cover, plate);
    const tin = cv(size, size), tx = tin.getContext('2d');
    tx.drawImage(dots, 0, 0);
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = INK[plate];
    tx.fillRect(0, 0, size, size);

    const [rx, ry] = REG[plate];
    o.save();
    o.globalCompositeOperation = 'multiply';
    o.drawImage(tin, rx, ry);
    o.restore();
  }
  baked.set(key, out);
  return out;
}

/** Ink starvation: evenly filled solids read as laser print, so drop flecks. */
function starve(g, rng) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-out';
  const w = g.canvas.width, n = Math.round(w * 1.1);
  for (let i = 0; i < n; i++) {
    g.globalAlpha = 0.2 + rng() * 0.55;
    g.beginPath();
    g.arc(rng() * w, rng() * w, (0.5 + rng() * 2.0) * K, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

/* ── craft kit ────────────────────────────────────────────────────────────────
   Drawing vocabulary for scene plates. Copy this whole block into a new film,
   between starve() and the scenes.

   Shapes are Path2D values rather than marks on the context, so one shape can
   be filled on one plate, knocked out of another and hatched on a third. That
   is what plate discipline needs, and it removes the usual trap of rebuilding
   a shape per ink and having the knockout miss.

   Everything draws coverage in 1080-space: fill style is already '#000' and
   globalAlpha is tone, so 0.4 means a 40% dot screen.                        */

const TAU = Math.PI * 2;

/* — shape builders ——————————————————————————————————————————————— */

/** Catmull-Rom through pts, as a dense polyline. */
function curve(pts, closed, per) {
  per = per || 12;
  const n = pts.length, out = [];
  const at = (i) => pts[closed ? (i + n * 2) % n : clamp(i, 0, n - 1)];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2
               + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2
               + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3),
      ]);
    }
  }
  if (!closed) out.push(pts[n - 1].slice());
  return out;
}

/** Points around an ellipse, for feeding cut(). */
function ringPts(x, y, rx, ry, n, rot) {
  const out = [], c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, px = Math.cos(th) * rx, py = Math.sin(th) * ry;
    out.push([x + px * c - py * s, y + px * s + py * c]);
  }
  return out;
}

/**
 * Closed hand-cut contour through control points: the silhouette builder.
 * A shape made of arcs and ellipses reads as clip art however good the screen
 * is, because every edge has the same machine curvature.
 *   o.amp   edge waver in px — 2 is a drawn line, 8 is torn stock
 *   o.tear  0..1 chance per sample of a deeper bite inward
 */
function cut(pts, rng, o) {
  o = o || {};
  const amp = o.amp === undefined ? 3 : o.amp, tear = o.tear || 0;
  const c = curve(pts, true, o.per || 10), n = c.length;
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = c[i], b = c[(i + 1) % n];
    area += a[0] * b[1] - b[0] * a[1];
  }
  const sgn = area > 0 ? 1 : -1;            // keep the normal pointing outward

  /* Displace along the normal, then smooth: an unsmoothed tear lands on one
     sample and reads as damage rather than as a bay in the edge. */
  const w1 = makeWob(rng, 4), w2 = makeWob(rng, 9), d = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU;
    d[i] = (w1(th) + w2(th * 3) * 0.3) * amp;
    if (tear && rng() < tear) d[i] -= amp * (1.4 + rng() * 1.6);
  }
  for (let pass = 0; pass < 2; pass++) {
    const s = Float32Array.from(d);
    for (let i = 0; i < n; i++) d[i] = (s[(i - 1 + n) % n] + s[i] * 2 + s[(i + 1) % n]) * 0.25;
  }

  const p = new Path2D();
  for (let i = 0; i < n; i++) {
    const a = c[(i - 1 + n) % n], b = c[(i + 1) % n];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const x = c[i][0] + sgn * ty * d[i], y = c[i][1] - sgn * tx * d[i];
    i ? p.lineTo(x, y) : p.moveTo(x, y);
  }
  p.closePath();
  return p;
}

/**
 * Variable-width ribbon along a path, as a fillable shape. Canvas has no
 * pressure, so a constant lineWidth is the default and it is what makes stems,
 * branches, whiskers and rigging read as wire. wfn(u) returns half-width.
 */
function nib(pts, wfn, o) {
  o = o || {};
  const c = o.raw ? pts : curve(pts, false, o.per || 10);
  const n = c.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const w = Math.max(0.01, wfn(i / (n - 1)));
    L.push([c[i][0] - ty * w, c[i][1] + tx * w]);
    R.push([c[i][0] + ty * w, c[i][1] - tx * w]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  return p;
}

/** Width profiles for nib(). */
const wTip = (w) => (u) => w * (1 - u * u);                       // full, lifting to a point
const wSwell = (w, at, k) => (u) => w * Math.exp(-Math.pow((u - at) / (k || 0.35), 2));
const wLeaf = (w, skew) => (u) => w * Math.pow(Math.sin(Math.PI * Math.pow(u, skew || 0.55)), 1.15);

/**
 * Calligraphic width from a held nib: widest where the path runs across the
 * nib's axis, thinnest where it runs along it. This is where hand-drawn line
 * weight comes from, and it is what makes a contour read as drawn rather than
 * traced. Pass the same polyline you give nib(), with raw: true.
 */
function wNib(c, w0, ang, floor) {
  const n = c.length, f = floor === undefined ? 0.22 : floor;
  return (u) => {
    const i = clamp(Math.round(u * (n - 1)), 0, n - 1);
    const a = c[Math.max(0, i - 1)], b = c[Math.min(n - 1, i + 1)];
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]);
    return w0 * (f + (1 - f) * Math.abs(Math.sin(th - ang)));
  };
}

/**
 * A horizon band closed to the bottom of the frame: hills, treeline, roofline,
 * wave. Stack several at falling tone and the air between them reads as depth.
 *   o.amp  height of the undulation   o.freq  how many bumps across the frame
 *   o.tilt fraction of W the far end drops   o.teeth adds a jagged octave
 */
function ridgeAt(y, o) {
  const amp = o.amp === undefined ? 60 : o.amp;
  const w = makeWob(o.rng, o.harm || 5), t = o.teeth ? makeWob(o.rng, 7) : null;
  return (u) => y + w(u * (o.freq || 5)) * amp + (o.tilt || 0) * (u - 0.5) * W
                + (t ? t(u * 37) * amp * 0.22 : 0);
}

/**
 * Mountain profile: overlapping triangular peaks with a jagged octave on top,
 * because a skyline built from smooth harmonics always reads as hills however
 * tall it is. Same u -> y contract as ridgeAt, so ridge() takes either.
 */
function peaksAt(y, o) {
  const amp = o.amp === undefined ? 90 : o.amp, n = o.n || 5, ps = [];
  for (let i = 0; i < n; i++) {
    ps.push({ c: (i + 0.5) / n + (o.rng() - 0.5) * 0.7 / n,
              h: amp * (0.4 + o.rng() * 0.6), w: (0.55 + o.rng() * 0.9) / n,
              lean: (o.rng() - 0.5) * 0.7 });
  }
  const jag = makeWob(o.rng, 8);
  return (u) => {
    let top = y;
    for (const p of ps) {
      const d = (u - p.c) / p.w;
      const yy = y - p.h * Math.max(0, 1 - Math.abs(d)) * (1 + p.lean * (d > 0 ? 1 : -1));
      if (yy < top) top = yy;
    }
    return top + jag(u * 26) * amp * 0.06;
  };
}

/** x across the frame -> the u that ridgeAt takes, for planting on a skyline. */
const ridgeU = (x) => (x + 60) / (W + 120);

function ridge(y, o) {
  o = o || {};
  const f = typeof y === 'function' ? y : ridgeAt(y, o);
  const n = o.n || 120, p = new Path2D();
  p.moveTo(-60, W + 60);
  for (let i = 0; i <= n; i++) p.lineTo(-60 + i / n * (W + 120), f(i / n));
  p.lineTo(W + 60, W + 60);
  p.closePath();
  return p;
}

/* — paint operations ————————————————————————————————————————————— */

/** Fill a shape at a tone. */
function print(g, path, a) { tone(g, a === undefined ? 1 : a); g.fill(path); }

/** Knock a shape out of the plate underneath it, at full coverage.
    A knockout drawn at a tone leaves the screen's gaps behind, so the plate
    below shows through the holes — always clear solid. */
function carve(g, path) {
  g.save();
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'destination-out';
  g.fill(path);
  g.restore();
}

/**
 * Print a shape at an exact tone, clearing whatever the plate already holds
 * beneath it. Tones on one plate add where they overlap, so a stack of ridges
 * drawn back to front ends up solid at the bottom of the frame — which looks
 * like a colour band rather than land. Every plane in a depth stack goes
 * through here.
 */
function plane(g, path, a) { carve(g, path); print(g, path, a); }

/** Outline a shape. Line work fades on width and alpha, never on coverage. */
function keyline(g, path, w, a) {
  tone(g, a === undefined ? 1 : a);
  g.lineWidth = w === undefined ? 3 : w;
  g.stroke(path);
}

/**
 * Tone ramp inside a shape — a coverage gradient, which the screen turns into
 * a dot-size ramp. This is the signature riso gesture and neither film uses it.
 * Baked plates only: a live inkPass screens at one flat coverage, so a gradient
 * there prints smooth, which is the thing the brief forbids.
 *   o.stops  [[at, tone], ...]      o.x0,y0,x1,y1  linear
 *   o.x,y,r0,r  radial
 */
function shade(g, path, o) {
  g.save();
  if (path) g.clip(path);
  const grd = o.r !== undefined
    ? g.createRadialGradient(o.x, o.y, o.r0 || 0, o.x, o.y, o.r)
    : g.createLinearGradient(o.x0, o.y0, o.x1, o.y1);
  for (const [at, a] of o.stops) grd.addColorStop(clamp(at, 0, 1), 'rgba(0,0,0,' + clamp(a, 0, 1) + ')');
  if (o.cut) g.globalCompositeOperation = 'destination-out';
  g.globalAlpha = 1;
  g.fillStyle = grd;
  g.fillRect(-W, -W, W * 3, W * 3);
  g.restore();
}

/**
 * Parallel hatching clipped to a shape: tone made of line rather than dot.

/* ── the kids ─────────────────────────────────────────────────────────────────

   are absolute in the rig frame: 0 hangs straight down, +π/2 points right, π
   points up. Heads stay turned to camera (3/4 by `look`) so faces always read. */
const KIDS = {
  emma: { h: 47, torso: 98, shW: 25, hipW: 16, ua: 42, fa: 38, th: 52, sh: 50, ar: 9.2, lr: 10.5,
    shirt: C.lav, shoe: C.navy, sole: { pink: .45, blue: .1 } },
  parker: { h: 43, torso: 84, shW: 24, hipW: 15, ua: 36, fa: 33, th: 44, sh: 42, ar: 8.6, lr: 10,
    shirt: C.polo, shoe: C.red, sole: {} },

const POSE0 = { x: 0, y: 0, s: 1, rot: 0, flip: 1, lean: 0, tilt: 0,
  aL: [-0.22, 0.12], aR: [0.22, -0.12], lL: [-0.06, 0], lR: [0.06, 0],
  face: 'smile', look: [0, 0], hair: [0, 1], flutter: 0, skirt: 0, feet: 'front',
  handL: 'fist', handR: 'fist', back: [false, false], legs: true, blink: false };

function kidFrame(who, o, base) {
  const K = KIDS[who], p = Object.assign({}, POSE0, o);
  let m = new DOMMatrix().translate(p.x, p.y).rotate(p.rot * DEG).scale(p.s * p.flip, p.s);

    hpL: R2([-K.hipW * 0.7, -4], p.lean), hpR: R2([K.hipW * 0.7, -4], p.lean),

  J.legL = limb(J.hpL, p.lL, K.th, K.sh); J.legR = limb(J.hpR, p.lR, K.th, K.sh);

/* Midpoint of the two hands in rig units: used to hang a kid from a bar. */

function kid(who, o, base) {
  const { K, p, m, J } = kidFrame(who, o, base);

    }

    }

      for (const s of [-0.28, 0.28]) {
        const d = dirA(A.a1 + s); hp.addPath(capsule(A.h, addv(A.h, d, rr * 3.1), rr * 0.5, rr * 0.45));
      }
    } else if (hand === 'thumb') {
      hp.addPath(capsule(A.h, addv(A.h, [0, -1], rr * 2.4), rr * 0.6, rr * 0.55));
    } else if (hand === 'open') {
      for (const s of [-0.55, -0.18, 0.18, 0.55]) hp.addPath(capsule(A.h, addv(A.h, dirA(A.a1 + s), rr * 2.2), rr * 0.42, rr * 0.38));
    }

      put(X(capsule(addv(heel, sd, rr * 0.5), addv(toe, sd, rr * 0.5), rr * 0.9, rr * 0.8), m), K.shoe);
      put(X(capsule(addv(heel, sd, rr * 1.25), addv(toe, sd, rr * 1.25), rr * 0.32), m), K.sole);

      strokeOn('indigo', X(ph, tm), 2.2, .35);
      strokeOn('pink', X(ph, tm), 1.2, .5);

    put(X(tee, tm), C.lav);

    put(X(circ(3, -T * 0.52, 3.2), tm), { pink: .6 });

/* ── sound kit ────────────────────────────────────────────────────────────────
   Deterministic score synthesis for renderAudio(). Copy this block after the
   motion kit. Depends on rngFor, clamp, lerp and W. Every noise buffer is
   seeded by key, every envelope starts and ends at silence, and nothing reads
   a clock or Math.random, so a cold render is repeatable and audio.mjs --twice
   can prove it.

   Time arguments are film seconds. Instruments take the score `s` first, then
   `at`, then options. `hit` in options places the loudest moment on that time
   by starting the sound `attack` earlier; use it wherever the picture has a
   visible arrival. Levels are linear gains before the master; the mix is
   scaled once after render to a loudness target, so balance voices against
   each other rather than against full scale.

   Top-level names the block declares, so a film can spot a collision before
   pasting: RATE, TINY, hz, note, MODES, degree, grid, Score, impulse,
   integratedLufs, truePeakLinear, wavBase64, onset, pad, struck, mallet, glass,
   bell, musicBox, pluck, fm, organ, sub, tick, breath, wind, rain, drop,
   MATERIALS, contact, paper, riser, air.
   ───────────────────────────────────────────────────────────────────────── */

const RATE = 48000;
const TINY = 1e-4;                       // exponential ramps cannot reach 0
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
const NOTE_INDEX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
/** 'F#3' -> 54. Octave 4 holds middle C. */
const note = (name) => {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
  return 12 * (Number(m[3]) + 1) + NOTE_INDEX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
};
const MODES = {
  major: [0, 2, 4, 5, 7, 9, 11], lydian: [0, 2, 4, 6, 7, 9, 11], mixolydian: [0, 2, 4, 5, 7, 9, 10],
  dorian: [0, 2, 3, 5, 7, 9, 10], minor: [0, 2, 3, 5, 7, 8, 10], pentatonic: [0, 2, 4, 7, 9],
  minorPentatonic: [0, 3, 5, 7, 10], wholeTone: [0, 2, 4, 6, 8, 10],
};
/** Scale degree (0-based, any octave, negative allowed) to midi. */
const degree = (root, mode, d) => {
  const steps = MODES[mode], n = steps.length, oct = Math.floor(d / n), i = ((d % n) + n) % n;
  return root + oct * 12 + steps[i];
};
/** Beat grid: g.at(beat) is the film time of a beat; g.beat is one beat in seconds. */
const grid = (bpm, offset = 0) => ({ bpm, beat: 60 / bpm, at: (b) => offset + b * 60 / bpm, quantise: (t) => offset + Math.round((t - offset) * bpm / 60) * 60 / bpm });

/** Build one score. duration is the film's DUR; the buffer is exactly that long. */
function Score({ duration, rate = RATE, key = 'score', room = {} } = {}) {
  const ac = new OfflineAudioContext(2, Math.ceil(rate * duration), rate);
  const s = { ac, rate, duration, key, buffers: new Map(), stats: null };

  // Buses. The master carries only a rumble filter; loudness is set after render
  // with one static gain, because DynamicsCompressor differs between engines.
  s.master = ac.createGain();
  const rumble = ac.createBiquadFilter(); rumble.type = 'highpass'; rumble.frequency.value = 28; rumble.Q.value = .5;
  s.master.connect(rumble).connect(ac.destination);
  s.bus = {};
  for (const name of ['bed', 'fore', 'fx']) { const g = ac.createGain(); g.connect(s.master); s.bus[name] = g; }

  // Reverb: synthesised IR, normalize off so the wet level is ours. The send is
  // high-passed so bass stays dry and centred; the return is low-passed so the
  // tail does not accumulate hiss over a long film.
  const verb = ac.createConvolver(); verb.normalize = false; verb.buffer = impulse(s, key + ':room', room);
  const sendIn = ac.createBiquadFilter(); sendIn.type = 'highpass'; sendIn.frequency.value = room.sendHighpass ?? 180;
  const ret = ac.createBiquadFilter(); ret.type = 'lowpass'; ret.frequency.value = room.returnLowpass ?? 6500; ret.Q.value = .4;
  s.wet = ac.createGain(); s.wet.gain.value = room.wet ?? .28;
  sendIn.connect(verb).connect(ret).connect(s.wet).connect(s.master);
  s.sendIn = sendIn;

  /** Pan and route a node. x is a screen coordinate 0..W; pan overrides it. */
  s.place = (node, { pan = null, x = null, send = .3, bus = 'fore' } = {}) => {
    const p = ac.createStereoPanner();
    p.pan.value = pan !== null ? clamp(pan, -1, 1) : x !== null ? clamp((x - W / 2) / (W / 2), -1, 1) * .7 : 0;
    node.connect(p).connect(s.bus[bus]);
    if (send > 0) { const g = ac.createGain(); g.gain.value = send; p.connect(g).connect(sendIn); }
    return p;
  };

  /** Seeded noise, cached per key. color: white | pink | brown. */

/** Struck material: an exciter through parallel modes. The exciter's speed is what reads as hard or soft. */
const MATERIALS = {
  wood: { modes: [[1, 1, .09], [2.8, .5, .06], [4.3, .3, .04]], exciter: 3200, burst: .003, q: 14 },
  metal: { modes: [[1, 1, 1.4], [1.6, .6, 1.1], [2.3, .5, .9], [3.4, .35, .7], [4.8, .2, .5]], exciter: 7000, burst: .002, q: 28 },
  stone: { modes: [[1, 1, .045], [1.7, .6, .035], [2.6, .4, .025]], exciter: 2200, burst: .006, q: 4 },
  felt: { modes: [[1, 1, .05], [2.1, .3, .03]], exciter: 500, burst: .02, q: 2 },

  m.modes.forEach(([ratio, amp, decay]) => {

    const g = s.ac.createGain(); s.env(g.gain, t0, { attack: .001, release: decay, peak: level * amp * (m.q > 8 ? 2.5 : 1.2) });

/** Paper: grains of ring-modulated noise. kind: slide | turn | flick | tear. */
function paperSfx(s, at, o = {}) {

/** Riser into `hit`: pitch, cutoff and gain climb together, then stop for the accent to land. */

  f.frequency.setValueAtTime(from * 3, t0); f.frequency.exponentialRampToValueAtTime(to * 4, hit);
  g.gain.setValueAtTime(TINY, t0); g.gain.exponentialRampToValueAtTime(level, hit - .02); g.gain.linearRampToValueAtTime(TINY, hit + .01);
  const osc = s.osc(type, from, t0, hit); osc.frequency.exponentialRampToValueAtTime(to, hit); osc.connect(f).connect(g);

/** Room tone across the whole film: what keeps a quiet picture from sounding like a dropout. */

  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch), r = rngFor(`${s.key}:${key}:${ch}`); let low = 0; for (let i = 0; i < d.length; i++) { low = low * .982 + (r() * 2 - 1) * .018; d[i] = low * (.9 + .1 * Math.sin(i / s.rate * .39 + ch)); } }

/* ── end sound kit ────────────────────────────────────────────────────────── */

/* ── score ────────────────────────────────────────────────────────────────────
   One tune, dressed for each world. A four-bar C-major motif ("da-da-DA-da-DA,
   da-da-DAA") on a music box at the desk; plucked bass and ukulele-ish strums
   join on Emma's throw (the grid is anchored so a downbeat lands on the
   release); in the sky it moves to mallets; under the big top it becomes a
   calliope waltz whose bars are locked to the trapeze's half-swings; marimba
   ostinato and bird chirps in the jungle; half-time glass over a warm pad at
   sunset; the music box brings it home and a bell chord rings out the end.
   Every event time is read from the picture's own data (FOLDS, TRAP, LOOP,
   SCENES_T), so retiming the picture retimes the sound.                     */

const BPM = 112, BEAT = 60 / BPM, BAR = BEAT * 4;
const THROW_T = 8.86;
const G0 = THROW_T - 4 * BAR;                          // bar 4 downbeat = the throw
const barT = (k) => G0 + k * BAR;
const nn = (n) => typeof n === 'number' ? n : note(n);
const CHORDS = {
  C: ['C3', 'E4', 'G4', 'C5'], Am: ['A2', 'E4', 'A4', 'C5'], F: ['F2', 'F4', 'A4', 'C5'],
  G: ['G2', 'D4', 'G4', 'B4'], Dm: ['D3', 'D4', 'F4', 'A4'], Em: ['E3', 'E4', 'G4', 'B4'],
};
const MA = [[0, 'E5'], [0.5, 'G5'], [1, 'A5'], [1.5, 'G5'], [2, 'E5'], [3, 'C5'], [3.5, 'D5'], [4, 'E5'], [6, 'D5']];
const MB = [[0, 'F5'], [0.5, 'A5'], [1, 'B5'], [1.5, 'A5'], [2, 'F5'], [3, 'D5'], [3.5, 'E5'], [4, 'F5'], [5, 'E5'], [5.5, 'D5'], [6, 'C5']];
function phrase(s, t0, notes, voice, o, tr, beat) {
  for (const [b, n] of notes) voice(s, t0 + b * (beat || BEAT), nn(n) + (tr || 0), Object.assign({}, o));
}
function chirp(s, at, f0, f1, dur, o = {}) {
  const { level = .03, x = 540, send = .4 } = o;
  const g = s.ac.createGain(), stop = s.env(g.gain, at, { attack: .006, release: dur, peak: level });
  const osc = s.osc('sine', f0, at, stop); osc.frequency.setValueAtTime(f0, at); osc.frequency.exponentialRampToValueAtTime(f1, at + dur * 0.8);

const MARKS = [];
let scorePromise = null, scoreBuffer = null;
function buildScore() {

    breath(s, 9.4, 1.9, { level: .035, from: 700, to: 1600, back: 500, peakAt: .5, x: 540, key: 'loopRoom' });
    phrase(s, barT(4) + BEAT * 2, MB.slice(0, 8), musicBox, { level: .06 });
    riser(s, 12.8, 1.4, { level: .05, from: 220, to: 1320, type: 'triangle' });
    bell(s, 12.8, nn('C6'), { hit: 12.8, level: .05, decay: 2.2 });
    glass(s, 12.8, nn('G5'), { level: .04, decay: 2 }); glass(s, 12.8, nn('E5'), { level: .04, decay: 2 });

    const skyBars = [6, 7, 8, 9, 10];

    skyBars.forEach((k, i) => {

    [0, 2, 4, 7, 9, 12, 14, 16].forEach((d, i) => glass(s, LOOP.t0 + 0.1 + i * (lp - LOOP.t0 - 0.1) / 8, nn('C5') + d, { level: .03 }));
    [16, 14, 12, 9, 7, 4, 2, 0].forEach((d, i) => glass(s, lp + i * (LOOP.t0 + LOOP.d - lp) / 8, nn('C5') + d, { level: .026 }));

    sub(s, T.sky.end - 0.05, nn('C2'), { hit: T.sky.end - 0.05, level: .12, release: 1.2 });
    contact(s, T.sky.end - 0.05, { material: 'felt', f0: 140, level: .1 });

    contact(s, lights, { material: 'metal', f0: 600, level: .05 });
    MARKS.push(lights);
    pad(s, 25.3, 28.5, ['C3', 'G3', 'E4'].map(nn), { level: .02, attack: 1.2, release: .6 });
    [[25.8, ['C5', 'E5', 'G5']], [26.4, ['D5', 'F5', 'A5']], [27.0, ['E5', 'G5', 'C6']]].forEach(([t, ns]) => ns.forEach(n => calliope(s, t, .35, nn(n), .03)));

    wind(s, 51.6, 60.5, { level: .018, centre: 500, whistle: .03, key: 'sunwind' });
    const swapS = 58.55 + 0.38;
    breath(s, 58.55, .9, { level: .06, from: 900, to: 3000, back: 600, peakAt: .4, key: 'poofS' });
    bell(s, swapS, nn('G5'), { level: .05, decay: 2 });
    MARKS.push(+swapS.toFixed(2));
    breath(s, 59.3, 2.3, { level: .06, from: 1600, to: 500, back: 300, peakAt: .7, x: 620, key: 'dive' });
    [19, 16, 12, 9, 7, 4, 0].forEach((d, i) => glass(s, 59.4 + i * 0.26, nn('C5') + d, { level: .03 }));
    riser(s, 62.95, 1.8, { level: .04, from: 165, to: 990, type: 'triangle', key: 'window' });
    ['C5', 'E5', 'G5'].forEach(n => glass(s, 62.95, nn(n), { level: .035, decay: 2.2 }));

    /* 7 · home: the music box again, a landing, a bell to end */
    pad(s, 62.9, 71.75, ['C3', 'G3', 'E4'].map(nn), { level: .022, attack: 1.5, release: 2.6, cutoff: 800 });
    phrase(s, 63.4, MA.slice(0, 6), musicBox, { level: .07 });
    breath(s, 64.3, 1.5, { level: .045, from: 600, to: 1500, back: 400, peakAt: .8, x: 560, key: 'glide' });
    contact(s, 65.75, { material: 'card', f0: 300, level: .09, x: 560 });
    paperSfx(s, 65.78, { kind: 'slide', dur: .45, level: .06, x: 590, key: 'skid' });
    MARKS.push(65.75);
    [0, 4, 7, 12].forEach((d, i) => glass(s, 66.25 + i * 0.07, nn('C6') + d - 12, { level: .03, x: 700 }));
    phrase(s, 66.9, MB, musicBox, { level: .075 });
    const endT = 66.9 + 6 * BEAT;
    ['C4', 'E4', 'G4', 'C5', 'E5'].forEach((n, i) => bell(s, endT + i * 0.02, nn(n), { level: .035, decay: 3.2 }));
    sub(s, endT, nn('C2'), { level: .07, release: 2.4, drop: 0 });

    const b = await s.render({ target: -16, ceiling: -1 });
    scoreBuffer = b; window.__scoreStats = s.stats;
    return b;
  })();
  return scorePromise;
}
async function renderAudio() { return wavBase64(await buildScore()); }

/* In-page player: sound follows play / pause / seek; off until switched on. */
let liveCtx = null, liveSrc = null, soundOn = false;
function stopSound() { if (liveSrc) { try { liveSrc.stop(); } catch (e) { /* ended */ } liveSrc = null; } }
async function startSound(from) {
  stopSound();
  if (!soundOn) return;
  const b = await buildScore();
  liveCtx = liveCtx || new AudioContext(); await liveCtx.resume();
  liveSrc = liveCtx.createBufferSource(); liveSrc.buffer = b; liveSrc.connect(liveCtx.destination);
  liveSrc.start(0, clamp(from, 0, DUR - 0.01));
}

// ART END

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
canvas.width=canvas.height=OUT;
paper=bakePaper();
const scrub=document.getElementById('scrub'),clockLabel=document.getElementById('time');
function render(t) {
  t=clamp(t,0,DUR); ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.drawImage(paper,0,0);drawArt(t);scrub.value=t;clockLabel.value=t.toFixed(2);
}
function paintBaked(id) {
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(bakeScene(id,OUT),0,0);ctx.restore();
}
let at=0,playing=false,epoch=0,recorder=null,recordURL=null;
function pause(){if(playing)at=clamp((performance.now()-epoch)/1000,0,DUR);playing=false;stopSound();document.getElementById('play').textContent='Play';if(recorder?.state==='recording')recorder.stop();}
function play(){if(at>=DUR)at=0;epoch=performance.now()-at*1000;playing=true;startSound(at);document.getElementById('play').textContent='Pause';}
function seek(t){pause();at=clamp(t,0,DUR);render(at);}
document.getElementById('play').onclick=()=>playing?pause():play();
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent='Sound: '+(soundOn?'on':'off');if(playing)startSound(at);else stopSound();};
document.getElementById('replay').onclick=()=>{seek(0);play();};
scrub.oninput=()=>seek(Number(scrub.value));
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space')playing?pause():play();if(e.code==='ArrowLeft')seek(at-1/30);if(e.code==='ArrowRight')seek(at+1/30);});
document.getElementById('record').onclick=()=>{
  if(recorder?.state==='recording'){pause();return;}
  const mime=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('No supported recording codec; use tools/render.mjs');
  seek(0);const stream=canvas.captureStream(30),chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);recordURL=URL.createObjectURL(new Blob(chunks,{type:mime}));const a=document.getElementById('download');a.href=recordURL;a.download='preview.webm';a.style.display='inline';};
  recorder.start();play();
};
function tick(now){if(playing){at=clamp((now-epoch)/1000,0,DUR);render(at);if(at>=DUR)pause();}requestAnimationFrame(tick);}
window.__riso={duration:DUR,ready:false,seek,shots:SHOTS,renderAudio,marks:MARKS};
buildScore();
for(const id of Object.keys(SCENES))bakeScene(id,OUT);
seek(Number(new URLSearchParams(location.search).get('t'))||0);
requestAnimationFrame(tick);
window.__riso.ready=true;
